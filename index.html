    <!-- Hover underline in nav-->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const nav = document.querySelector("#mainNav .navbar-nav");
            const links = nav.querySelectorAll(".nav-link");
            const indicator = nav.querySelector(".nav-indicator");

            if (!nav || !indicator || !links.length) return;

            function moveIndicator(link) {
                const navRect = nav.getBoundingClientRect();
                const linkRect = link.getBoundingClientRect();
                // Position relative to the navbar list,
                // which is already aligned to the right.
                const left =
                    linkRect.left -
                    navRect.left +
                    (linkRect.width - indicator.offsetWidth) / 2;
                indicator.style.transform =
                    `translateX(${left}px)`;
            }

            // Determine which page is currently active
            const currentPath =
                window.location.pathname.split("/").pop() || "index.html";
            let activeLink = links[0];
            links.forEach(link => {
                const linkPath =
                    new URL(link.href, window.location.origin)
                        .pathname
                        .split("/")
                        .pop() || "index.html";
                if (linkPath === currentPath) {
                    activeLink = link;
                }
            });
            // Put underline under current page
            moveIndicator(activeLink);
            // Slide underline when hovering
            links.forEach(link => {

                link.addEventListener("mouseenter", function () {
                    moveIndicator(link);
                });

            });
            // Return underline to active page
            nav.addEventListener("mouseleave", function () {
                moveIndicator(activeLink);
            });
            // Recalculate position if window changes size
            window.addEventListener("resize", function () {
                moveIndicator(activeLink);
            });
        });
    </script>
